# Gradle JVM settings. The Minecraft decompilation step needs a decent heap.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment properties

# The Minecraft version must agree with the Forge version to get a valid artifact.
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
# The Forge version must agree with the Minecraft version to get a valid artifact.
forge_version=47.4.28
forge_version_range=[47,)
# The loader version range can only use the major version of Forge/FML as bounds.
loader_version_range=[47,)
# Mapping channel and version. The official channel uses Mojang names and is
# versioned by the Minecraft version.
mapping_channel=official
mapping_version=1.20.1

## Mod properties

# The mod id must fit the regex [a-z][a-z0-9_]{1,63}. It is used as the resource
# namespace, so it must match the String constant in the @Mod class.
mod_id=desert_mining_reborn
# Human-readable display name.
mod_name=Desert Mining Reborn
# License declared in mods.toml.
mod_license=MIT
# Mod version, following semver.
mod_version=0.1.0
# Base package of the sources.
mod_group_id=com.rexthar.desertminingreborn
# Authors shown in the mod list.
mod_authors=Rexthar
# Description shown in the mod list.
mod_description=A clean-room reimplementation of the Desert Mining concept for Minecraft 1.20.1 on Forge.\nSandy ores fall like sand, hand sieves process the chunks, and three new shovels change how you mine the desert.
